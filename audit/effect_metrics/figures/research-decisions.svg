<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">Verification trades automation for review</title><desc id="figure-desc">36 scheduled historical research decisions from the same report records</desc><rect x="0" y="0" width="820" height="290" fill="#f4f8fa" rx="16" /><text x="26" y="40" fill="#142639" font-size="24" font-weight="700" text-anchor="start">Verification trades automation for review</text><text x="26" y="65" fill="#455c71" font-size="14" font-weight="400" text-anchor="start">36 scheduled historical research decisions from the same report records</text><rect x="26" y="86" width="13" height="13" fill="#087b72" rx="2" /><text x="45" y="98" fill="#455c71" font-size="14" font-weight="400" text-anchor="start">Correct action</text><rect x="193" y="86" width="13" height="13" fill="#ad3934" rx="2" /><text x="212" y="98" fill="#455c71" font-size="14" font-weight="400" text-anchor="start">Wrong action</text><rect x="353" y="86" width="13" height="13" fill="#66778b" rx="2" /><text x="372" y="98" fill="#455c71" font-size="14" font-weight="400" text-anchor="start">Sent to review</text><text x="26" y="142" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Raw report</text><rect x="166" y="122" width="577.056" height="28" fill="#087b72" rx="0" /><text x="454.528" y="141" fill="white" font-size="14" font-weight="700" text-anchor="middle">34</text><rect x="743.056" y="122" width="16.9722" height="28" fill="#ad3934" rx="0" /><rect x="760.028" y="122" width="16.9722" height="28" fill="#66778b" rx="0" /><text x="166" y="166" fill="#455c71" font-size="12" font-weight="400" text-anchor="start">34 correct  ·  1 wrong  ·  1 sent to review</text><text x="26" y="203" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Verified report</text><rect x="166" y="183" width="441.278" height="28" fill="#087b72" rx="0" /><text x="386.639" y="202" fill="white" font-size="14" font-weight="700" text-anchor="middle">26</text><rect x="607.278" y="183" width="169.722" height="28" fill="#66778b" rx="0" /><text x="692.139" y="202" fill="white" font-size="14" font-weight="700" text-anchor="middle">10</text><text x="166" y="227" fill="#455c71" font-size="12" font-weight="400" text-anchor="start">26 correct  ·  0 wrong  ·  10 sent to review</text><text x="26" y="268" fill="#455c71" font-size="13" font-weight="400" text-anchor="start">The replay counts review referrals. It does not observe what happened during review.</text></svg>

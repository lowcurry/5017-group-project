<svg xmlns="http://www.w3.org/2000/svg" width="820" height="374" viewBox="0 0 820 374" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">How many correct components make it through?</title><desc id="figure-desc">Formal G/E comparison across the same scheduled tasks</desc><rect x="0" y="0" width="820" height="374" fill="#f4f8fa" rx="16" /><text x="26" y="40" fill="#142639" font-size="24" font-weight="700" text-anchor="start">How many correct components make it through?</text><text x="26" y="65" fill="#455c71" font-size="14" font-weight="400" text-anchor="start">Formal G/E comparison across the same scheduled tasks</text><text x="26" y="93" fill="#335e99" font-size="14" font-weight="700" text-anchor="start">G  Ordinary prompting</text><text x="246" y="93" fill="#087b72" font-size="14" font-weight="700" text-anchor="start">E  Evidence-guided prompting</text><line x1="246" y1="129" x2="246" y2="321" stroke="#d7e2e8" /><text x="246" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">0%</text><line x1="366" y1="129" x2="366" y2="321" stroke="#d7e2e8" /><text x="366" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">25%</text><line x1="486" y1="129" x2="486" y2="321" stroke="#d7e2e8" /><text x="486" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">50%</text><line x1="606" y1="129" x2="606" y2="321" stroke="#d7e2e8" /><text x="606" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">75%</text><line x1="726" y1="129" x2="726" y2="321" stroke="#d7e2e8" /><text x="726" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">100%</text><text x="26" y="165" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Raw correct</text><rect x="246" y="144" width="400" height="16" fill="#335e99" rx="3" /><text x="653" y="157" fill="#335e99" font-size="12" font-weight="700" text-anchor="start">40/48</text><rect x="246" y="167" width="450" height="16" fill="#087b72" rx="3" /><text x="703" y="180" fill="#087b72" font-size="12" font-weight="700" text-anchor="start">45/48</text><text x="26" y="228" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Correct and reproducible</text><rect x="246" y="207" width="340" height="16" fill="#335e99" rx="3" /><text x="593" y="220" fill="#335e99" font-size="12" font-weight="700" text-anchor="start">34/48</text><rect x="246" y="230" width="430" height="16" fill="#087b72" rx="3" /><text x="683" y="243" fill="#087b72" font-size="12" font-weight="700" text-anchor="start">43/48</text><text x="26" y="291" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Correct and published</text><rect x="246" y="270" width="310" height="16" fill="#335e99" rx="3" /><text x="563" y="283" fill="#335e99" font-size="12" font-weight="700" text-anchor="start">31/48</text><rect x="246" y="293" width="420" height="16" fill="#087b72" rx="3" /><text x="673" y="306" fill="#087b72" font-size="12" font-weight="700" text-anchor="start">42/48</text><text x="26" y="354" fill="#455c71" font-size="13" font-weight="400" text-anchor="start">Denominator: scheduled answerable components per group, including budget stops.</text></svg>

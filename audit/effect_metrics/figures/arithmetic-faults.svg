<svg xmlns="http://www.w3.org/2000/svg" width="820" height="374" viewBox="0 0 820 374" role="img" aria-labelledby="figure-title figure-desc" font-family="Arial, sans-serif"><title id="figure-title">Do shared arithmetic errors get published?</title><desc id="figure-desc">The same six paired fault cases under the old and new publication rules</desc><rect x="0" y="0" width="820" height="374" fill="#f4f8fa" rx="16" /><text x="26" y="40" fill="#142639" font-size="24" font-weight="700" text-anchor="start">Do shared arithmetic errors get published?</text><text x="26" y="65" fill="#455c71" font-size="14" font-weight="400" text-anchor="start">The same six paired fault cases under the old and new publication rules</text><text x="26" y="93" fill="#335e99" font-size="14" font-weight="700" text-anchor="start">Before  Existing verifier</text><text x="246" y="93" fill="#087b72" font-size="14" font-weight="700" text-anchor="start">After  Independent arithmetic added</text><line x1="246" y1="129" x2="246" y2="321" stroke="#d7e2e8" /><text x="246" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">0%</text><line x1="366" y1="129" x2="366" y2="321" stroke="#d7e2e8" /><text x="366" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">25%</text><line x1="486" y1="129" x2="486" y2="321" stroke="#d7e2e8" /><text x="486" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">50%</text><line x1="606" y1="129" x2="606" y2="321" stroke="#d7e2e8" /><text x="606" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">75%</text><line x1="726" y1="129" x2="726" y2="321" stroke="#d7e2e8" /><text x="726" y="120" fill="#455c71" font-size="12" font-weight="400" text-anchor="middle">100%</text><text x="26" y="165" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Correct controls</text><rect x="246" y="144" width="480" height="16" fill="#335e99" rx="3" /><text x="733" y="157" fill="#335e99" font-size="12" font-weight="700" text-anchor="start">6/6</text><rect x="246" y="167" width="480" height="16" fill="#087b72" rx="3" /><text x="733" y="180" fill="#087b72" font-size="12" font-weight="700" text-anchor="start">6/6</text><text x="26" y="228" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Wrong reports</text><text x="253" y="220" fill="#335e99" font-size="12" font-weight="700" text-anchor="start">0/6</text><text x="253" y="243" fill="#087b72" font-size="12" font-weight="700" text-anchor="start">0/6</text><text x="26" y="291" fill="#142639" font-size="14" font-weight="700" text-anchor="start">Shared verifier error</text><rect x="246" y="270" width="480" height="16" fill="#335e99" rx="3" /><text x="733" y="283" fill="#335e99" font-size="12" font-weight="700" text-anchor="start">6/6</text><text x="253" y="306" fill="#087b72" font-size="12" font-weight="700" text-anchor="start">0/6</text><text x="26" y="354" fill="#455c71" font-size="13" font-weight="400" text-anchor="start">Each row measures the share of cases published. The errors were injected offline.</text></svg>
